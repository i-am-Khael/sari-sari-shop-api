
# for nginx

server {
    listen 8000;
    server_name localhost;
    root /home/debian/workspace/sari-sari-shop-api/public;
    index index.php index.html;

    error_page 413 = @too_large;

    location @too_large {
      default_type application/json;
      return 413 '{ "status": 413, "error": "The image must not exceed 1MB and must be in JPG, PNG and WebP format." }';
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /storage/ {
      root /home/debian/workspace/sari-sari-shop-api;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_X_API_KEY $http_x_api_key;
        fastcgi_pass 127.0.0.1:9000;
    }
}
